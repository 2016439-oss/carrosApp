<!DOCTYPE html>
<html lang="es">
 
<head>
  <meta charset="UTF-8">
 
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/autosCat.css">
 
  <title>Carrusel de camisetas</title>

</head>
<body>
 
  <h1>Catálogo de Autos Clásicos</h1>

    <nav>
 
    <ul>
      <li>
        <a href="index.html">
          Inicio
        </a>
      </li>
 
      <li>
        <a href="registroAutos.html">
          Registrar Autos Clásicos
        </a>
      </li>
 
      <li>
        <a href="autosCat.html">
          Catálogo de autos
        </a>
      </li>
 
      <li>
        <a href="#" id="enlace-logout">
          Cerrar sesión
        </a>
      </li>
    </ul>
 
  </nav>
  <!-- Contenedor de Filtros -->
  <div class="filtros-contenedor">
    <input 
      type="text" 
      id="buscar-texto" 
      class="filtro-input" 
      placeholder="Buscar por marca o modelo...">
    
    <select id="filtrar-decada" class="filtro-select">
      <option value="">Todas las décadas</option>
      <option value="1920">Años 20s</option>
      <option value="1930">Años 30s</option>
      <option value="1940">Años 40s</option>
      <option value="1950">Años 50s</option>
      <option value="1960">Años 60s</option>
      <option value="1970">Años 70s</option>
      <option value="1980">Años 80s</option>
      <option value="1990">Años 90s</option>
    </select>
  </div>
 
  <div class="carrusel-contenedor">
 
    <button
      type="button"
      id="btn-anterior"
      class="boton-carrusel boton-anterior">
      ❮
    </button>
 
    <div class="carrusel-ventana">
      <div id="carrusel" class="carrusel"></div>
    </div>
 
    <button
      type="button"
      id="btn-siguiente"
      class="boton-carrusel boton-siguiente">
      ❯
    </button>
 
  </div>
 
  <div id="mensaje"></div>
 
  <script>
    const API_Autos = '/api/auto';
 
    const carrusel = document.getElementById('carrusel');
    const btnAnterior = document.getElementById('btn-anterior');
    const btnSiguiente = document.getElementById('btn-siguiente');
    const mensaje = document.getElementById('mensaje');
    
    const buscarTexto = document.getElementById('buscar-texto');
    const filtrarDecada = document.getElementById('filtrar-decada');
 
    let autos = [];          
    let autosFiltrados = []; 
    let posicionActual = 0;
 
    document.addEventListener('DOMContentLoaded', iniciarPagina);
 
    async function iniciarPagina() {
      const sesionValida = await verificarSesion();
 
      if (!sesionValida) {
        return;
      }
 
      btnAnterior.addEventListener('click', mostrarAnterior);
      btnSiguiente.addEventListener('click', mostrarSiguiente);
      
      buscarTexto.addEventListener('input', aplicarFiltros);
      filtrarDecada.addEventListener('change', aplicarFiltros);
 
      window.addEventListener('resize', () => {
        posicionActual = 0;
        actualizarCarrusel();
      });
 
      await cargarAutos();
    }
 
    function obtenerToken() {
      return localStorage.getItem('token');
    }
 
    function obtenerHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + obtenerToken()
      };
    }
 
    async function verificarSesion() {
      const token = obtenerToken();
 
      if (!token) {
        regresarAlLogin();
        return false;
      }
 
      try {
        const respuesta = await fetch('/api/verificatoken', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });
 
        if (!respuesta.ok) {
          regresarAlLogin();
          return false;
        }
 
        return true;
 
      } catch (error) {
        console.error('Error verificando la sesión:', error);
        regresarAlLogin();
        return false;
      }
    }
 
    function regresarAlLogin() {
      localStorage.removeItem('token');
      window.location.replace('login.html');
    }
 
    async function cargarAutos() {
      try {
        const respuesta = await fetch(API_Autos, {
          method: 'GET',
          headers: obtenerHeaders()
        });
 
        const datos = await procesarRespuesta(respuesta);
 
        autos = datos;
        autosFiltrados = [...autos]; 
        posicionActual = 0;
 
        mostrarAutos();
 
      } catch (error) {
        console.error(error);
        mostrarMensaje(error.message, true);
      }
    }
 
    async function procesarRespuesta(respuesta) {
      if (respuesta.status === 401 || respuesta.status === 403) {
        regresarAlLogin();
        throw new Error('La sesión expiró');
      }
 
      let datos = {};
 
      try {
        datos = await respuesta.json();
      } catch (error) {
        datos = {};
      }
 
      if (!respuesta.ok) {
        throw new Error(
          datos.error || 'No fue posible completar la operación'
        );
      }
 
      return datos;
    }

    function aplicarFiltros() {
      const texto = buscarTexto.value.toLowerCase().trim();
      const decadaSeleccionada = filtrarDecada.value;

      autosFiltrados = autos.filter(auto => {
        const coincideMarca = auto.marca ? auto.marca.toLowerCase().includes(texto) : false;
        const coincideModelo = auto.modelo ? auto.modelo.toLowerCase().includes(texto) : false;
        const pasaTexto = texto === '' || coincideMarca || coincideModelo;

        let pasaDecada = true;
        if (decadaSeleccionada !== '') {
          const anioInicio = parseInt(decadaSeleccionada);
          const anioFin = anioInicio + 9;
          const anioAuto = parseInt(auto.anio); 
          pasaDecada = (anioAuto >= anioInicio && anioAuto <= anioFin);
        }

        return pasaTexto && pasaDecada;
      });

      posicionActual = 0; 
      mostrarAutos();
    }
 
    function mostrarAutos() {
      carrusel.replaceChildren();
 
      if (autosFiltrados.length === 0) {
        const aviso = document.createElement('div');
        aviso.className = 'sin-autos';
        aviso.textContent = 'No hay autos que coincidan con la búsqueda.';
        carrusel.appendChild(aviso);
 
        btnAnterior.disabled = true;
        btnSiguiente.disabled = true;
        return;
      }
 
      autosFiltrados.forEach((auto, indice) => {
        const tarjeta = crearTarjetaAuto(auto, indice);
        carrusel.appendChild(tarjeta);
      });
 
      actualizarCarrusel();
    }
 
    function crearTarjetaAuto(auto, indice) {
      const tarjeta = document.createElement('article');
      tarjeta.className = 'tarjeta-auto';
 
      const titulo = document.createElement('h2');
      titulo.className = 'titulo-auto';
      titulo.textContent = (auto.marca && auto.modelo) ? `${auto.marca} ${auto.modelo}` : 'Auto ' + (indice + 1);
      tarjeta.appendChild(titulo);
 
      if (auto.imagenUrl) {
        const img = document.createElement('img');
        img.src = auto.imagenUrl; 
        img.className = 'imagen-auto'; 
        img.alt = `${auto.marca || 'Auto'} ${auto.modelo || ''}`;
        tarjeta.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'sin-imagen-placeholder';
        placeholder.textContent = 'Sin Imagen';
        tarjeta.appendChild(placeholder);
      }
 
      return tarjeta;
    }
 
    function obtenerCantidadVisible() {
      if (window.innerWidth <= 600) return 1;
      if (window.innerWidth <= 850) return 2;
      return 3;
    }
 
    function mostrarAnterior() {
      if (posicionActual > 0) {
        posicionActual--;
        actualizarCarrusel();
      }
    }
 
    function mostrarSiguiente() {
      const cantidadVisible = obtenerCantidadVisible();
      const posicionMaxima = Math.max(autosFiltrados.length - cantidadVisible, 0);
 
      if (posicionActual < posicionMaxima) {
        posicionActual++;
        actualizarCarrusel();
      }
    }
 
    function actualizarCarrusel() {
      if (autosFiltrados.length === 0) return;
 
      const cantidadVisible = obtenerCantidadVisible();
      const posicionMaxima = Math.max(autosFiltrados.length - cantidadVisible, 0);
 
      if (posicionActual > posicionMaxima) {
        posicionActual = posicionMaxima;
      }
 
      const primeraTarjeta = carrusel.querySelector('.tarjeta-auto');
      if (!primeraTarjeta) return;
 
      const anchoTarjeta = primeraTarjeta.getBoundingClientRect().width;
      const estilosCarrusel = window.getComputedStyle(carrusel);
      const espacio = parseFloat(estilosCarrusel.gap) || 20;
 
      const desplazamiento = posicionActual * (anchoTarjeta + espacio);
      carrusel.style.transform = 'translateX(-' + desplazamiento + 'px)';
 
      btnAnterior.disabled = posicionActual === 0;
      btnSiguiente.disabled = posicionActual >= posicionMaxima;
    }
 
    function mostrarMensaje(texto, esError = false) {
      mensaje.textContent = texto;
      mensaje.className = esError ? 'mensaje-error' : 'mensaje-correcto';
 
      setTimeout(() => {
        mensaje.textContent = '';
        mensaje.className = '';
      }, 2500);
    }
  </script>
 
</body>
 
</html>
